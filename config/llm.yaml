# LLM 공급자 설정. 모델 이름·단가는 화면에서 바꿀 수 있다. 단가는 USD / 100만 토큰(추정, 공급자 요금표 확인 필요).
call_limit_per_question: 4      # 질문 한 개당 LLM 호출 상한(계획 1 + 재시도 2 + 해설 1)
max_output_tokens: 2000
timeout_sec: 60
providers:
  offline:
    label: "오프라인 모드(키 없이, 규칙 기반)"
    model: "rule-based"
  openai:
    label: "OpenAI"
    model: "gpt-4o-mini"
    key_env: OPENAI_API_KEY
    price: {in: 0.15, out: 0.60}
  anthropic:
    label: "Claude(Anthropic)"
    model: "claude-haiku-4-5"
    key_env: ANTHROPIC_API_KEY
    price: {in: 1.00, out: 5.00}
  gemini:
    label: "Gemini(Google)"
    model: "gemini-2.5-flash"
    key_env: GEMINI_API_KEY
    price: {in: 0.30, out: 2.50}
